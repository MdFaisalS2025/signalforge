name: signalforge

services:
  # ---------------------------------------------------------------------
  # Core dependencies (Week 1 scope: wiring only, not yet configured)
  # ---------------------------------------------------------------------
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-signalforge}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme-local-only}
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse

  temporal-postgresql:
    image: postgres:16
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.25
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgresql
    ports:
      - "7233:7233"
    depends_on:
      - temporal-postgresql

  temporal-ui:
    image: temporalio/ui:2.31.2
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8081:8080"
    depends_on:
      - temporal

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    volumes:
      - ../../observability/otel-collector:/etc/otelcol-contrib
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ../../observability/prometheus:/etc/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: changeme-local-only
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana

  # ---------------------------------------------------------------------
  # SignalForge services (Week 1 scope: empty placeholder containers;
  # real implementations land in later weeks per the MVP delivery plan)
  # ---------------------------------------------------------------------
  demo-orders:
    image: alpine:3.20
    command: ["sleep", "infinity"]

  demo-payments:
    image: alpine:3.20
    command: ["sleep", "infinity"]

  demo-inventory:
    image: alpine:3.20
    command: ["sleep", "infinity"]

  collector-go:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    depends_on:
      - redpanda
      - clickhouse

  agent-python:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    depends_on:
      - clickhouse
      - temporal

  remediation:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    depends_on:
      - temporal

  api:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    depends_on:
      - clickhouse
      - temporal

  web:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    depends_on:
      - api

volumes:
  redpanda-data:
  clickhouse-data:
  temporal-postgres-data:
  grafana-data:
