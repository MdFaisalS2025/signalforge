name: signalforge

services:
  # ---------------------------------------------------------------------
  # Core dependencies (Week 1 scope: wiring only, not yet configured)
  # ---------------------------------------------------------------------
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info", "--brokers", "redpanda:9092"]
      interval: 2s
      timeout: 5s
      retries: 30

  redpanda-init:
    image: redpandadata/redpanda:v24.2.7
    restart: "no"
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - 'for t in telemetry.raw.v1 deployments.v1 telemetry.dead-letter.v1 incidents.created.v1; do rpk topic describe "$$t" --brokers redpanda:9092 >/dev/null 2>&1 || rpk topic create "$$t" --partitions 1 --replicas 1 --brokers redpanda:9092; done'

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-signalforge}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme-local-only}
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 2s
      timeout: 5s
      retries: 30

  temporal-postgresql:
    image: postgres:16
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.25
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgresql
    ports:
      - "7233:7233"
    depends_on:
      - temporal-postgresql

  temporal-ui:
    image: temporalio/ui:2.31.2
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8084:8080"
    depends_on:
      - temporal

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    volumes:
      - ../../observability/otel-collector:/etc/otelcol-contrib
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    ports:
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ../../observability/prometheus:/etc/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: changeme-local-only
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana

  # ---------------------------------------------------------------------
  # SignalForge services
  # ---------------------------------------------------------------------
  demo-orders:
    build: ../../services/demo-orders
    environment:
      PORT: "8081"
      OTEL_SERVICE_NAME: demo-orders
      PAYMENTS_URL: http://demo-payments:8082
      PAYMENTS_TIMEOUT_MS: "3000"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
    ports:
      - "8081:8081"
    depends_on:
      - otel-collector
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5

  demo-payments:
    build: ../../services/demo-payments
    environment:
      PORT: "8082"
      OTEL_SERVICE_NAME: demo-payments
      PAYMENTS_FAULT_MODE: ${PAYMENTS_FAULT_MODE:-disabled}
      PAYMENTS_VERSION: ${PAYMENTS_VERSION:-0.1.0}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local}
      DEPLOYMENT_ID: ${DEPLOYMENT_ID:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
    ports:
      - "8082:8082"
    depends_on:
      - otel-collector
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8082/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5

  demo-inventory:
    image: alpine:3.20
    command: ["sleep", "infinity"]

  collector-go:
    build: ../../services/collector-go
    environment:
      KAFKA_BROKERS: redpanda:9092
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_DB: signalforge
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: changeme-local-only
      INCIDENT_PUBLISH_FAIL_ATTEMPTS: ${INCIDENT_PUBLISH_FAIL_ATTEMPTS:-0}
      INCIDENT_CRASH_AFTER_PRODUCE: ${INCIDENT_CRASH_AFTER_PRODUCE:-0}
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    restart: "no"

  agent-python:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    depends_on:
      - clickhouse
      - temporal

  remediation:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    depends_on:
      - temporal

  api:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    depends_on:
      - clickhouse
      - temporal

  web:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    depends_on:
      - api

volumes:
  redpanda-data:
  clickhouse-data:
  temporal-postgres-data:
  grafana-data:
